<header class="nav" [class.scrolled]="scrolled()" [class.open]="menuOpen()">
  <div class="container nav-inner">
    <a href="#home" class="brand" (click)="closeMenu()" aria-label="Back to top">
      <span class="logo">{{ profile.initials }}</span>
      <span class="brand-name">{{ profile.name }}</span>
    </a>

    <nav id="primary-nav" class="links" aria-label="Primary">
      @for (link of links; track link.id) {
        <a [href]="'#' + link.id" [class.active]="active() === link.id" (click)="closeMenu()">{{ link.label }}</a>
      }
      <a class="btn primary resume-mobile" [href]="profile.resume" download (click)="closeMenu()">
        <app-icon name="download" [size]="16" /> Resume
      </a>
    </nav>

    <div class="actions">
      <button
        type="button"
        class="icon-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" />
      </button>
      <a class="btn primary resume-desktop" [href]="profile.resume" download>
        <app-icon name="download" [size]="16" /> Resume
      </a>
      <button
        type="button"
        class="icon-btn menu-btn"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="primary-nav"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
      </button>
    </div>
  </div>
</header>
